{% set name = "kdtree" %}
{% set version = "0.17" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9ea2052758fa800582d80e7612199216202b3a55bcf9da8dd1777791a39dc278

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vvv "

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - kdtree

about:
  home: https://github.com/stefankoegl/kdtree
  license: ISC
  license_family: OTHER
  license_file: LICENSE
  summary: A Python implementation of a kd-tree
  doc_url: https://python-kdtree.readthedocs.org/
  dev_url: https://github.com/stefankoegl/kdtree

extra:
  recipe-maintainers:
    - lincrosenbach
    - kfasolin
    - nicoddemus
